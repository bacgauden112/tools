<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hộp Đồ Nghề</title>
  <meta name="description" content="Bộ công cụ cá nhân chạy hoàn toàn trong trình duyệt: tạo QR, nén ảnh, định dạng JSON và nhiều hơn nữa.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4fd1'/%3E%3Cpath d='M9 12h14v11a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2zM13 12V9.5A1.5 1.5 0 0 1 14.5 8h3A1.5 1.5 0 0 1 19 9.5V12' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="side" id="side">
      <a class="brand" href="#">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM9 9V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V9M4 13h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-name">Hộp Đồ Nghề</span>
      </a>
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Tìm công cụ…  ( / )" autocomplete="off">
      </label>
      <nav id="nav" class="nav" aria-label="Danh sách công cụ"></nav>
      <div class="side-foot">
        <button id="theme" class="ghost" type="button">Giao diện: <span id="theme-label">Theo máy</span></button>
        <p class="privacy">Mọi xử lý chạy trên máy bạn. Không có dữ liệu nào được gửi lên server.</p>
      </div>
    </aside>

    <header class="topbar">
      <a class="brand" href="#">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM9 9V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V9M4 13h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-name">Hộp Đồ Nghề</span>
      </a>
      <button id="menu" class="ghost" type="button" aria-controls="side" aria-expanded="false">Công cụ</button>
    </header>

    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
